[project]
name = "generate-pydantic-schema-docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{name = "brightSPARK Labs", email = "enquire@brightsparklabs.com"}]
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "typer==0.27.2",
    "json-schema-for-humans==1.5.1",
]

[project.scripts]
generate-pydantic-schema-docs = "generate_pydantic_schema_docs.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "prek==0.5.3",
    "ruff==0.16.8",
    "yamlfix==1.19.1",
    "yamllint==1.38.0",
]
